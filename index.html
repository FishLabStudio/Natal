:root{
  --evergreen:#102a23;--deep:#0d211b;--paper:#faf3e5;--ink:#233c31;
  --muted:#5d5c4d;--gold:#d5a960;--gold-dark:#8a571f;--cranberry:#8c342e;
  --serif:Noel,Georgia,serif;--sans:NoelSans,system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;min-height:100svh;display:grid;place-items:center;
  background:radial-gradient(ellipse at 48% -10%,#34594a 0%,transparent 62%),var(--deep);
  color:var(--ink);font:400 15px/1.55 var(--sans);
  padding:clamp(13px,4.5vw,64px);
}
main{
  width:min(100%,1000px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  min-height:625px;overflow:hidden;border:1px solid #b99b636b;border-radius:25px;
  box-shadow:0 28px 85px #020d08a0;
}
.scene{
  position:relative;isolation:isolate;overflow:hidden;min-height:100%;
  background:#213d32 radial-gradient(ellipse at 52% 62%,#94734c 0%,#39564b 33%,#16372d 58%,#0c241c 85%);
}
.scene::before,.scene::after,.scene-art{position:absolute;inset:0;pointer-events:none}
.scene-art{z-index:-3;width:100%;height:100%;object-fit:cover;object-position:center 56%}
.scene::before{content:"";z-index:-2;background:linear-gradient(180deg,#0a22174c,transparent 32%,transparent 67%,#0d2219db)}
.scene::after{content:"";border:1px solid #f5d99f40;border-radius:16px;inset:12px;z-index:2}
.glow{
  position:absolute;z-index:-1;inset:5%;pointer-events:none;
  background:radial-gradient(ellipse at 48% 62%,#f6bf7040 0%,transparent 38%);
  mix-blend-mode:screen;animation:glow 5s ease-in-out infinite alternate;
}
@keyframes glow{from{opacity:.19}to{opacity:.83}}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.flake{
  position:absolute;left:var(--x);top:-8%;width:var(--size);aspect-ratio:1;
  border-radius:50%;background:#ffedd0;opacity:0;box-shadow:0 0 5px #ffedb866;
  animation:fall var(--time) var(--delay) linear infinite;
}
@keyframes fall{
  0%{transform:translate(0,0);opacity:0}
  12%,80%{opacity:var(--alpha)}
  100%{transform:translate(var(--drift),var(--fall-distance,690px));opacity:0}
}
.panel{
  padding:48px clamp(29px,5vw,67px);display:grid;align-items:center;
  background:radial-gradient(ellipse at 98% 0%,#f4e1bf 0%,transparent 49%),
    repeating-linear-gradient(0deg,#9b703405 0 1px,transparent 1px 5px),var(--paper);
  position:relative;min-width:0;
}
.panel::before{
  content:"";position:absolute;top:15px;left:15px;right:15px;height:19px;pointer-events:none;
  background:linear-gradient(90deg,#a8764050 19px,transparent 19px calc(100% - 19px),#a8764050 0) top/100% 1px no-repeat,
    linear-gradient(#a8764050,#a8764050) left/1px 19px no-repeat,
    linear-gradient(#a8764050,#a8764050) right/1px 19px no-repeat;
}
.seal-line{
  width:max-content;display:flex;align-items:center;gap:11px;color:var(--gold-dark);
  margin:0 0 22px;
}
.seal-line::before,.seal-line::after{content:"";width:28px;height:1px;background:#a5734168}
.seal-line span{font-size:23px;line-height:1}
h1,h2{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.037em}
h1{font-size:clamp(3.1rem,5.65vw,5.1rem);line-height:.98}
h1 em{display:block;font-weight:400;color:var(--cranberry);font-size:.84em;margin-top:.14em}
.intro{color:var(--muted);margin:17px 0 26px;max-width:38ch}
label{display:block;font-weight:bold;margin-bottom:6px;font-size:.92rem}
.field+.field{margin-top:15px}
input,button{font:inherit}
.field input{
  width:100%;border:1px solid #bfa785;border-radius:10px;background:#fffaf0;
  color:var(--ink);min-height:49px;padding:10px 13px;font-size:16px;
  transition:border-color .2s,box-shadow .2s;
}
.field input::placeholder{color:#746c5e}
.field input:focus{border-color:#496452;box-shadow:0 0 0 3px #4d745331;outline:none}
.hint{color:var(--muted);margin:6px 0 0;font-size:.79rem}
.message{
  font-size:.86rem;color:#812b26;background:#922b2410;border-left:2px solid #9f4f3d;
  border-radius:0 6px 6px 0;padding:7px 10px;margin:14px 0 0;
}
button{
  width:100%;min-height:52px;border-radius:10px;border:1px solid #1d4132;font-weight:bold;
  padding:11px 16px;cursor:pointer;transition:background .2s,transform .2s,box-shadow .2s;
}
button:focus-visible{outline:2px solid #9d6129;outline-offset:4px}
button:active{transform:translateY(1px)}
.primary{
  margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:#224637;color:#fff8e8;box-shadow:0 5px 10px #213d2829;
}
.primary:hover{background:#315a47;box-shadow:0 7px 14px #213d2830}
.primary:disabled{cursor:wait;opacity:.72}
.primary span:last-child{font-size:1.28em;font-weight:400;line-height:1}
.result{text-align:center;position:relative}
.letter{
  position:relative;margin:0 auto 23px;width:132px;height:91px;background:#992e32;
  border:1px solid #812c2d;border-radius:9px;box-shadow:0 9px 17px #922e293c;
}
.letter::before,.letter::after{content:"";position:absolute;inset:0;border-radius:inherit}
.letter::before{background:#b65145;clip-path:polygon(0 100%,50% 35%,100% 100%)}
.letter::after{background:#ba5d4f;clip-path:polygon(0 0,100% 0,50% 66%)}
.letter span{
  position:absolute;z-index:1;top:45%;left:50%;translate:-50% 0;
  display:grid;place-items:center;width:29px;height:29px;border-radius:50%;
  background:#e7bb72;color:#633923;font-size:18px;box-shadow:0 2px 5px #65282275;
}
.result.open .letter{animation:letter-in .52s cubic-bezier(.22,.9,.3,1.2) both}
.result.open .reveal{animation:reveal-in .62s .14s ease both}
@keyframes letter-in{from{opacity:0;transform:translateY(23px) rotate(-8deg) scale(.86)}to{opacity:1;transform:none}}
@keyframes reveal-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.result h2{color:var(--cranberry);font-size:clamp(3rem,5.9vw,5.4rem);line-height:1.1;overflow-wrap:anywhere}
.greeting{margin:0 0 5px;font-weight:bold}
.result-copy{color:var(--muted);margin:12px 0 24px}
.secondary{border-color:#a38862;color:var(--ink);background:#fff8ed}
.secondary:hover{background:#f3e3c8}
.particle{
  pointer-events:none;position:absolute;z-index:3;top:46px;left:50%;color:var(--gold-dark);
  font-size:var(--size);animation:scatter .82s var(--delay) ease-out both;
}
@keyframes scatter{
  0%{transform:translate(0,0) scale(.4);opacity:0}
  20%{opacity:.9}
  100%{transform:translate(var(--x),var(--y)) rotate(var(--rot)) scale(.7);opacity:0}
}
@media(max-width:700px){
  main{grid-template-columns:1fr;min-height:0;max-width:460px;border-radius:20px}
  .scene{height:clamp(185px,40vw,268px);--fall-distance:305px}
  .scene-art{object-position:center 60%}
  .scene::after{inset:9px;border-radius:12px}
  .panel{padding:27px 23px 29px}
  .panel::before{display:none}
  .seal-line{margin-bottom:12px}
  h1{font-size:clamp(2.9rem,10vw,4.15rem)}
  h1 em{display:block;margin-top:.14em}
  .intro{margin:11px 0 19px}
  .primary{margin-top:18px}
  .result{padding:13px 0 3px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.snow,.particle{display:none}}
</style>
</head>

    const speed = 7 + Math.random() * 11;
    flake.style.setProperty("--x", Math.random() * 100 + "%");
    flake.style.setProperty("--size", 1.1 + Math.random() * 3.2 + "px");
    flake.style.setProperty("--alpha", .19 + Math.random() * .55);
    flake.style.setProperty("--time", speed + "s");
    flake.style.setProperty("--delay", -Math.random() * speed + "s");
    flake.style.setProperty("--drift", (Math.random() - .48) * 85 + "px");
    snow.append(flake);
  }
}
</script>
